name: Release

# Builds the Docker image, publishes it to GitHub Container Registry, and cuts
# a GitHub Release whenever a version tag is pushed. Tag pushes only — routine
# branch syncs never trigger a build. No secrets needed: the built-in
# GITHUB_TOKEN authenticates to ghcr and creates the release.
#
# workflow_dispatch runs the same build with publishing switched off. Without
# it, every Dependabot bump to the docker/* actions or the Dockerfile base
# image would merge on a green `check` that never executed one line of them,
# and the breakage would surface mid-release. After merging such a bump:
#
#   gh workflow run release.yml --ref main
#   gh run watch <id> --exit-status
#   gh run view <id> --json jobs --jq '.jobs[] | .steps[] | .conclusion + "  " + .name'
#
# The last command matters: it proves the build steps ran rather than that the
# run was merely green. Residual gap, accepted knowingly: the ghcr login and
# the release-creation steps are reachable only by a real tag push, so the next
# release remains their first exercise.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compute image name and version tags
        id: meta
        run: |
          # ghcr requires a lowercase image path
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # A dry run is dispatched on a BRANCH, so GITHUB_REF_NAME is a branch
            # name -- and a Dependabot branch such as
            # dependabot/docker/docker-723a34ecce contains slashes, which are
            # illegal in a Docker tag and abort the build before it starts.
            # Nothing is pushed on a dry run, so the tag is cosmetic: use a fixed
            # one and keep the branch in the display version.
            VERSION="$GITHUB_REF_NAME"
            DOCKER_TAG="dryrun"
          else
            # v4.1.0+ap.1 -> 4.1.0+ap.1 (release/display) -> 4.1.0-ap.1 ('+' is illegal)
            VERSION="${GITHUB_REF_NAME#v}"
            DOCKER_TAG="${VERSION//+/-}"
          fi
          echo "image=$IMAGE"           >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "docker_tag=$DOCKER_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'   # dry runs never touch the registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.docker_tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: github.event_name == 'push'   # dry runs never cut a release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.meta.outputs.version }}
          body: |
            Docker image:

            ```
            docker pull ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.docker_tag }}
            docker pull ${{ steps.meta.outputs.image }}:latest
            ```

            See the **Fork revision** changelog in the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for what changed in this release.
          generate_release_notes: true
