name: CI

# Test suite (SQLite + MySQL) and SonarQube Cloud analysis. `check` is the
# branch-protection gate on main; `sonar` is advisory and is skipped whenever
# the run cannot reach repository secrets.
on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref: a burst of merges to main cancels the superseded
# runs instead of stacking them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: my_idlers_test
          MARIADB_USER: idlers
          MARIADB_PASSWORD: idlers
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, gd, zip
          coverage: pcov

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare app key
        run: |
          echo "APP_KEY=" > .env
          php artisan key:generate --force

      - name: Run tests with coverage (SQLite)
        run: vendor/bin/phpunit --coverage-clover coverage.xml

      # Production is MySQL; several bug classes (int columns as strings,
      # changed-vs-matched row counts) are invisible under SQLite.
      #
      # Unlike the old Gitea runner, GitHub-hosted jobs run on the VM rather
      # than inside a container, so the service is reachable on 127.0.0.1 --
      # which is exactly what phpunit.mysql.xml defaults to. Do NOT set DB_HOST
      # here; a real environment variable would override that default.
      - name: Run tests (MySQL)
        run: vendor/bin/phpunit -c phpunit.mysql.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.xml
          retention-days: 1

  # The PHP suite never touches npm, so a front-end dependency can break the
  # asset build while `check` stays green -- which is exactly how five major
  # bumps (jQuery 4, Vue 3, FontAwesome 7, DataTables 3, sass-loader 17) landed
  # on main with a passing CI run and an unbuildable front end. This job is the
  # gate for that class of change.
  assets:
    name: assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      # ci, not install: build from the lockfile exactly, and fail if
      # package.json and package-lock.json have drifted apart.
      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      # Built assets are COMMITTED and served directly -- the Dockerfile runs no
      # npm step -- so forgetting to rebuild after a CSS or JS change silently
      # ships the old bundle. The Vite build is byte-reproducible, so comparing
      # it against what is committed catches exactly that.
      #
      # If this fails: run `npm run build` and commit public/build (and
      # public/webfonts, if the FontAwesome package changed).
      - name: Fail if the committed build is stale
        run: git diff --exit-code -- public/build public/webfonts

  sonar:
    name: sonar
    needs: check
    runs-on: ubuntu-latest
    # Two cases cannot read SONAR_TOKEN and would only ever fail:
    #   - Dependabot events run with a restricted token.
    #   - Pull requests from forks are denied repository secrets.
    # `check` still runs for both, so the merge gate is unaffected.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so SonarQube can compute blame and new-code periods.
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage

      # SonarQube Cloud: SONAR_TOKEN only. SONAR_HOST_URL is the self-hosted
      # knob and setting it in env would point the scan at the wrong place.
      #
      # The destination is pinned as a scanner argument instead, because a -D
      # argument beats sonar-project.properties. This job runs on same-repo
      # pull requests with SONAR_TOKEN in scope and checks out the PR's own
      # content, so without this a pull request could add
      # `sonar.host.url=https://…` to the properties file and redirect the
      # scan -- taking the token with it. Note this closes the properties-file
      # route only: anyone able to push a branch here can also edit this
      # workflow, so the real boundary is still who has write access. If a
      # collaborator is ever added, move SONAR_TOKEN into an Environment with
      # required reviewers, which binds workflow edits too.
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: -Dsonar.host.url=https://sonarcloud.io
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
