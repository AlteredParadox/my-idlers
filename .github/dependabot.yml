version: 2

# Every Dependabot PR is gated by the `check` job in ci.yml. The `sonar` job is
# skipped for these PRs -- Dependabot events run with a restricted token that
# cannot read SONAR_TOKEN, so the scan could only fail.
updates:
  # Grouping needs an explicit applies-to per kind: a group with no applies-to
  # covers version updates ONLY, so security updates arrive one PR per advisory.
  # Enabling Dependabot alerts opened seven separate npm PRs before this existed.
  #
  # The version-update groups deliberately cover minor and patch ONLY. Majors
  # fall outside every group and so arrive as one PR each -- a grouped PR
  # labelled "7 updates" once hid five breaking major jumps (jQuery 4, Vue 3,
  # FontAwesome 7, DataTables 3, sass-loader 17) that were merged together and
  # broke the asset build. One major per PR keeps them individually reviewable
  # and individually revertable.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      composer:
        applies-to: version-updates
        update-types: ['minor', 'patch']
        patterns: ['*']
      composer-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        applies-to: version-updates
        update-types: ['minor', 'patch']
        patterns: ['*']
      npm-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  # Base images in the Dockerfile. CI never builds the container, so validate
  # these with a real `docker build` (or a release.yml dry run) before merging.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']
