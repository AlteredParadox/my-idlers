# SonarQube Cloud (sonarcloud.io). The key is assigned at import time and is
# not free-form: it must match the project as created under the organization.
sonar.organization=alteredparadox
sonar.projectKey=AlteredParadox_my-idlers
sonar.projectName=my-idlers

sonar.sources=app,config,database,routes,resources/js
sonar.tests=tests
sonar.exclusions=**/vendor/**,**/node_modules/**,public/**,storage/**,bootstrap/cache/**,database/seeders/**

# Coverage is imported for PHP only -- there is no JavaScript test runner in
# this project, so every JS line counts as uncovered and drags both the overall
# figure and, more sharply, the new-code figure that the quality gate checks.
# resources/js is front-end bootstrap: imports, global assignments and the
# DataTables/Vue wiring. It is not unit-testable in any meaningful sense.
#
# EXCLUDED FROM COVERAGE ONLY, not from analysis: these files are still scanned
# for bugs, smells and vulnerabilities. Without this a two-line change to
# app.js fails the gate at 0% new coverage against an 80% threshold, because
# the denominator is those same two lines.
#
# database/migrations for a different reason with the same shape: phpunit.xml
# instruments ./app only, so a migration can never report coverage no matter
# how thoroughly it is exercised — and every test using RefreshDatabase runs
# all of them. They are schema definitions executed by the framework's
# migrator, not code the application calls, and the schema they produce is
# asserted by real tests (Schema::hasTable in AuditRoundFourTest, plus every
# test that reads or writes the tables). Without this, ADDING ANY MIGRATION
# fails the gate at 0% new coverage on its own lines.
#
# routes/** for the same structural reason as migrations: phpunit.xml
# instruments ./app, so a route file can never report coverage however
# thoroughly it is exercised — and every feature test drives these routes. They
# are declarative wiring (path, controller, middleware) rather than logic with
# branches, and the wiring IS asserted directly: several tests read
# Route::getRoutes() and check the middleware on a named route, which is a
# sharper assertion than line coverage would be. Without this, touching any
# route file fails the gate on its own lines.
sonar.coverage.exclusions=resources/js/**,database/migrations/**,routes/**

# Findings accepted on the self-hosted SonarQube and re-declared here.
#
# All three were marked Accepted on the old instance -- the two config ones
# since the 2022 import, the Pricing one since 2026-07-08 -- and they resurfaced
# on the move to SonarQube Cloud because issue resolutions live in the server's
# database and do not travel with the project. Declaring them here puts the
# decision in git, where it survives the next platform move and can be reviewed
# like any other change.
#
# Note these suppress the rule for the WHOLE file, not the single line the
# original acceptance covered. That is harmless for the two config files; for
# Pricing.php it means a future method there with too many returns will not be
# flagged. Revisit if that file grows.
sonar.issue.ignore.multicriteria=acceptedReturns,acceptedDbHost,acceptedLogPath

# S1142 "4 returns, more than the 3 allowed" on Pricing::refreshRates. The
# returns are a cache hit, a successful fetch, and two failure paths; splitting
# them buys nothing. Sonar batches that fixed S1142 in storeYabs, two
# controllers and resolveInstance deliberately left this one.
sonar.issue.ignore.multicriteria.acceptedReturns.ruleKey=php:S1142
sonar.issue.ignore.multicriteria.acceptedReturns.resourceKey=app/Models/Pricing.php

# S1192 "127.0.0.1 duplicated 4 times" -- stock Laravel config. Two of the four
# are DB_HOST defaults and two are REDIS_HOST defaults: different settings that
# merely share a loopback default, so a shared constant would imply a
# relationship that does not exist.
sonar.issue.ignore.multicriteria.acceptedDbHost.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.acceptedDbHost.resourceKey=config/database.php

# S1192 "logs/laravel.log duplicated 3 times" -- stock Laravel config; the
# single, daily and emergency channels each declare their own path.
sonar.issue.ignore.multicriteria.acceptedLogPath.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.acceptedLogPath.resourceKey=config/logging.php

sonar.php.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
