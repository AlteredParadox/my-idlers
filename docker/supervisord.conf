[supervisord]
nodaemon=true
; Intentional: supervisord must run as root to spawn nginx and php-fpm,
; which each drop to their own unprivileged users (nginx / www-data).
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Queue worker for password-reset mail. Without it the SMTP conversation runs
; inside the public /forgot-password request, which both pins a web worker for
; the length of an SMTP stall and makes the response measurably faster for an
; address that does not exist -- an account-existence oracle the generic
; response body cannot hide.
;
; Runs as www-data, not root: it executes application code and needs nothing
; the fpm workers do not already have.
;
; --max-time recycles the process hourly so a long-lived worker cannot
; accumulate memory or hold a stale config/DB handle; supervisord restarts it
; immediately, so this is a rolling restart rather than an outage. --tries=3
; sends a permanently failing send to failed_jobs instead of looping on it.
[program:queue]
command=php /app/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --quiet
user=www-data
autorestart=true
; A worker that keeps dying must be visible in the container log rather than
; silently retried forever: mail stops with it.
startretries=100
stopwaitsecs=35
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
