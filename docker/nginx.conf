# Access-log sanitising. This file is included from inside nginx's http{}
# block (/etc/nginx/http.d/*.conf), which is the only context `map` is legal in.
#
# The stock `combined` format logs $request, i.e. the whole request line
# including the query string, and these logs go to container stdout where a log
# shipper or anyone with `docker logs` can read them. Two kinds of live
# capability were landing there in plaintext:
#   - password-reset tokens, which sit in the PATH (/reset-password/<token>)
#   - signed-URL signatures for YABS ingestion, which sit in the QUERY
# Either is enough to act as the user until it expires.

# 1. Everything before the '?' -- the path, with the query string dropped.
#    $uri is unusable here: try_files rewrites it to /index.php, so every
#    application request would log as the same line.
map $request_uri $idlers_request_path {
    ~^(?<idlers_path>[^?]*)  $idlers_path;
    default                  $request_uri;
}

# 2. Redact the path segments that are themselves secrets. Redacting rather
#    than dropping the line keeps the request visible for rate/abuse review.
map $idlers_request_path $idlers_logged_path {
    ~^/reset-password/.       "/reset-password/[redacted]";
    ~^/verify-email/.         "/verify-email/[redacted]";
    default                   $idlers_request_path;
}

# 3. The same treatment for Referer, which is the OTHER way the token gets
#    here. The reset page loads same-origin assets (@vite bundle, favicon,
#    preloaded fonts), and a browser sends the full current URL as Referer on
#    same-origin subresource requests — so redacting only the request line
#    above left the token being written one line later, from the asset fetch.
#    Referrer-Policy (server block below) does NOT strip the path from
#    same-origin requests -- Laravel's back() redirects need it (see there).
#    The guest layout overrides it per document with
#    <meta name="referrer" content="no-referrer">, so a current browser on
#    the reset page sends no Referer at all -- which is what keeps the token
#    out of the access log of any proxy IN FRONT of this nginx, where no map
#    of ours can reach. This map is the backstop for anything that ignores
#    the meta.
map $http_referer $idlers_logged_referer {
    ~*/reset-password/.       "[redacted-reset-url]";
    ~*/verify-email/.         "[redacted-verify-url]";
    # No query string from a referer either: a signed URL's expires+signature
    # would otherwise be logged in full when its page loads an asset.
    ~^(?<idlers_ref>[^?]*)\?  $idlers_ref;
    default                   $http_referer;
}

# `combined` with the sanitised path and referer substituted in.
log_format idlers_sanitised '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $idlers_logged_path $server_protocol" '
                            '$status $body_bytes_sent "$idlers_logged_referer" "$http_user_agent"';

server {
    listen 8000;
    server_name _;

    root /app/public;
    index index.php;

    # Log to the container's output (alpine's default is files inside the
    # container). This is the log with real client addresses — php-fpm's
    # own access log only ever showed 127.0.0.1 (nginx is the FastCGI
    # client) and is disabled in docker/php-fpm-pool.conf.
    access_log /dev/stdout idlers_sanitised;
    error_log /dev/stderr warn;

    # Favicon uploads are validation-capped at 40 KB; 2m leaves form headroom
    # without allowing huge bodies.
    client_max_body_size 2m;

    # Browser-security headers (defense in depth; served on every response
    # incl. errors via `always`). NOTE: nginx add_header inheritance — any
    # location that declares its own add_header silently drops these, so
    # keep the location blocks add_header-free.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # same-origin: the full URL as Referer on same-origin requests, nothing at
    # all cross-origin. The app DOES read Referer: every validation failure
    # (and the YABS parse failure) is a Laravel back(), which redirects to the
    # Referer URL. This used to be strict-origin (#48), which trims the Referer
    # to the bare origin -- so every failed create form "redirected to the
    # dashboard" with the errors lost (issue #121). A policy that sends no
    # Referer would fall back to the session's previous URL, but that is
    # overwritten by any plain fetch() GET on the page, so same-origin is the
    # robust choice. The reset-token concern that motivated strict-origin is
    # handled by the $idlers_logged_referer map above: the full URL still
    # reaches nginx on same-origin asset loads, but is redacted before logging.
    add_header Referrer-Policy "same-origin" always;
    # CSP audited against the app's actual origins: all JS/CSS/fonts are
    # self-hosted Vite bundles (no CDNs); the compiled bootstrap CSS embeds
    # data: SVG images; Prometheus is proxied server-side through
    # /tools/prometheus/* so connect-src stays 'self'; geekbench and other
    # externals are plain <a href> links (not resource loads).
    # 'unsafe-inline' is still required by the blades' inline <script> blocks
    # and event handlers. 'unsafe-eval' is NOT: it used to be needed by the
    # Vue build that compiled in-DOM templates with new Function() at runtime,
    # and dropping Vue removed the last dynamic-code path in the bundle (grep
    # it for `Function(` / `eval(` — both are zero). Keeping it out means a
    # string that reaches a template compiler can no longer become code.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Exactly index.php and nothing else reaches php-fpm: the webroot is
    # www-data-writable for favicon uploads, so "the file exists" is no
    # longer proof it shipped with the image — an exact match closes the
    # webshell class outright instead of trusting upload validation alone.
    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi.conf;
    }

    location ~ \.php$ {
        return 404;
    }

    # Never serve dotfiles
    location ~ /\. {
        deny all;
    }
}
