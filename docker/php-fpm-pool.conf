; nginx logs every request (with real client addresses) to the container's
; stdout; php-fpm's own access log duplicated each line and only ever shows
; 127.0.0.1 (nginx is the FastCGI client). Keep fpm quiet except errors.
[www]
; nginx runs in this same container, so FastCGI must not be reachable from
; other containers (or from a host that publishes the inherited FPM port).
listen = 127.0.0.1:9000
access.log = /dev/null
